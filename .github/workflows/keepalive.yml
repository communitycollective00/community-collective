name: Supabase keep-alive
on:
  schedule:
    - cron: "0 14 */3 * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://ipzjggmxdgjqwyfiunlp.supabase.co/rest/v1/" -H "apikey: ${{ secrets.SUPA_ANONKEY }}")
          echo "Supabase responded: $code"
          [ "$code" -lt 500 ]
      - name: Keep this workflow from being auto-disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
